# Published from the Latch monorepo by ops/public/sync-contracts.mjs. Edit it there.
#
# The "hp-transient/" remapping is pinned per profile and never in a remappings.txt: that file
# silently overrides per-profile remappings and builds the wrong backend.

[profile.default]
src = "src"
out = "foundry-out"
solc_version = "0.8.26"
optimizer_runs = 25_666
via_ir = true
evm_version = "cancun"
bytecode_hash = "none"
allow_paths = ["../core"]
remappings = [
    "infinity-core/=../core/",
    "latch-hooks/=./",
    "forge-std/=../core/lib/forge-std/src/",
    "ds-test/=../core/lib/forge-std/lib/ds-test/src/",
    "@openzeppelin/=../core/lib/openzeppelin-contracts/",
    "solmate/=../core/lib/solmate/",
    "hp-transient/=../core/src/libraries/transient/eip1153/",
]

[profile.legacy]
src = "src"
out = "foundry-out-legacy"
solc_version = "0.8.26"
optimizer_runs = 25_666
via_ir = true
evm_version = "shanghai"
bytecode_hash = "none"
allow_paths = ["../core"]
remappings = [
    "infinity-core/=../core/",
    "latch-hooks/=./",
    "forge-std/=../core/lib/forge-std/src/",
    "ds-test/=../core/lib/forge-std/lib/ds-test/src/",
    "@openzeppelin/=../core/lib/openzeppelin-contracts/",
    "solmate/=../core/lib/solmate/",
    "hp-transient/=../core/src/libraries/transient/storage/",
]
